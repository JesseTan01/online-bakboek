<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mijn Bakboek</title>
<style>
  :root{
    --bg:         #FFFBFA;
    --pink:       #F2637C;
    --pink-dark:  #D94A63;
    --pink-soft:  #FDE7EA;
    --ink:        #3B2E2E;
    --ink-soft:   #9A8985;
    --line:       #F1E1E0;
    --shadow:     0 2px 10px rgba(59,46,46,0.06);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family: "Trebuchet MS", -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:17px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{ font-weight:800; color:var(--ink); margin:0; }

  header.top{
    background: var(--bg);
    padding: 22px 20px 16px;
    position:sticky;
    top:0;
    z-index:20;
    border-bottom: 1px solid var(--line);
  }
  header.top h1{
    font-size: 1.6rem;
    color: var(--pink-dark);
  }
  header.top .subtitle{
    margin: 4px 0 0;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .search-wrap{ margin-top:14px; }

  .wishlist-toggle{
    margin-top: 10px;
    background: none;
    border: 1px solid var(--pink);
    color: var(--pink-dark);
    font-size: 0.9rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    min-height: 40px;
  }
  .wishlist-toggle:active{ background: var(--pink-soft); }

  #wishlist-view{ display:none; }

  .wishlist-form{
    display:flex;
    gap:8px;
    margin: 6px 0 20px;
  }
  .wishlist-form input{
    flex:1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 1rem;
    background:#fff;
    color: var(--ink);
    outline:none;
    min-height:44px;
  }
  .wishlist-form input:focus{ border-color: var(--pink); }
  .wishlist-form button{
    background: var(--pink);
    color:#fff;
    border:none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 0.95rem;
    font-weight:700;
    cursor:pointer;
    min-height:44px;
  }

  .wishlist-item{ position:relative; }
  .wishlist-item .delete-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 1.3rem;
    line-height:1;
    cursor:pointer;
    padding: 4px 6px;
    min-height:44px;
  }
  #search{
    width:100%;
    padding:13px 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 1rem;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  #search:focus{ border-color: var(--pink); }
  #search::placeholder{ color: var(--ink-soft); }

  main{
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* ---------- Overzicht: ronde recept-thumbnails ---------- */
  #recipe-list{
    display:flex;
    flex-direction:column;
    gap: 30px;
    margin-top: 6px;
  }

  .category-heading{
    font-size: 1.05rem;
    color: var(--pink-dark);
    margin: 0 0 4px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--pink-soft);
  }

  .category-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px 16px;
  }
  @media (min-width: 520px){
    .category-grid{ grid-template-columns: repeat(3, 1fr); }
  }

  .recipe-entry{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    background:none;
    border:none;
    padding: 6px;
    cursor:pointer;
    text-align:center;
    min-height:44px;
  }
  .thumb{
    width: 112px;
    height: 112px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 2.6rem;
    box-shadow: var(--shadow);
    border: 3px solid #fff;
    outline: 1px solid var(--line);
  }
  .recipe-entry:active .thumb{ transform: scale(0.96); }
  .recipe-entry h2{
    font-size: 0.98rem;
    font-weight:700;
    line-height:1.25;
  }
  .recipe-entry .meta{
    color: var(--ink-soft);
    font-size: 0.8rem;
  }

  #empty-state{
    text-align:center;
    color: var(--ink-soft);
    padding: 40px 10px;
    display:none;
    grid-column: 1 / -1;
  }

  /* ---------- Detailpagina ---------- */
  #recipe-detail{ display:none; }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color: var(--pink-dark);
    font-size: 1rem;
    font-weight:700;
    padding: 10px 4px;
    margin: -6px 0 12px -4px;
    cursor:pointer;
    min-height:44px;
  }

  .detail-thumb{
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 3.4rem;
    margin: 0 auto 16px;
    box-shadow: var(--shadow);
    border: 4px solid #fff;
    outline: 1px solid var(--line);
  }

  .recipe-title{
    font-size: 1.5rem;
    text-align:center;
    margin: 0 0 10px;
    line-height:1.25;
  }

  .recipe-meta-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap: 10px 18px;
    margin-bottom: 24px;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }
  .recipe-meta-row span{ display:flex; align-items:center; gap:6px; }

  .section-title{
    font-size: 1.15rem;
    color: var(--pink-dark);
    margin: 28px 0 6px;
  }

  .subgroup-title{
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: 16px 0 4px;
  }

  .check-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .check-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    min-height:44px;
  }
  .check-item input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:24px;
    height:24px;
    min-width:24px;
    border-radius:50%;
    border:2px solid var(--pink);
    background:#fff;
    position:relative;
    cursor:pointer;
    margin-top:2px;
  }
  .check-item input[type="checkbox"]:checked{
    background: var(--pink);
  }
  .check-item input[type="checkbox"]:checked::after{
    content:'✓';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:14px;
    font-weight:700;
  }
  .check-item label{
    flex:1;
    cursor:pointer;
    padding-top:1px;
  }
  .check-item input[type="checkbox"]:checked + label{
    text-decoration: line-through;
    color: var(--ink-soft);
  }

  .source-line{
    margin-top: 28px;
    text-align:center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    word-break: break-word;
  }
  .source-line a{ color: var(--pink-dark); }

  footer.notice{
    text-align:center;
    color: var(--ink-soft);
    font-size: 0.8rem;
    padding: 10px 20px 30px;
  }
</style>
</head>
<body>

<header class="top">
  <h1>Mijn Bakboek</h1>
  <p class="subtitle" id="recipe-count"></p>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Zoek een recept…" autocomplete="off" />
  </div>
  <button class="wishlist-toggle" onclick="showWishlist()">📝 Nog te proberen</button>
</header>

<main>
  <div id="recipe-list"></div>
  <p id="empty-state">Geen recepten gevonden.</p>

  <div id="recipe-detail">
    <button class="back-btn" onclick="showList()">‹ Terug naar overzicht</button>
    <div id="detail-content"></div>
  </div>

  <div id="wishlist-view">
    <button class="back-btn" onclick="showList()">‹ Terug naar overzicht</button>
    <h1 class="recipe-title" style="text-align:left;">📝 Nog te proberen</h1>
    <div class="wishlist-form">
      <input id="wishlist-input" type="text" placeholder="Type hier..." autocomplete="off" />
      <button onclick="addWishlistItem()">Toevoegen</button>
    </div>
    <ul id="wishlist-list" class="check-list"></ul>
    <p id="wishlist-empty" style="color:var(--ink-soft); display:none;">Nog niets op je lijst — voeg hierboven iets toe!</p>
  </div>
</main>


<script>

   RECEPTEN-DATA
   Nieuw recept toevoegen? Voeg een nieuw object toe aan de "recipes"-array

   - id: unieke code (kleine letters, streepjes)
   - category: "Zoet" of "Brood" (bepaalt onder welke kop
     het recept in het overzicht verschijnt)
   - title, servings, time
   - emoji: gebruikt als rond "plaatje"
   - color: achtergrondkleur van het ronde plaatje
   - ingredientGroups: [{ name: "Onderdeelnaam", items: [strings] }, ...]
   - stepGroups: [{ name: "Onderdeelnaam", steps: [strings] }, ...]

/* =========================================================================
   RENDER-LOGICA (hoeft niet aangepast te worden bij nieuwe recepten)
   ========================================================================= */

const listEl = document.getElementById('recipe-list');
const emptyEl = document.getElementById('empty-state');
const detailEl = document.getElementById('recipe-detail');
const detailContent = document.getElementById('detail-content');
const countEl = document.getElementById('recipe-count');
const searchEl = document.getElementById('search');

function updateCount(n){
  countEl.textContent = n + (n === 1 ? " recept" : " recepten");
}

const categoryOrder = ["Zoet", "Brood"];

function renderList(filter){
  const q = (filter || "").trim().toLowerCase();
  listEl.innerHTML = "";
  let shown = 0;

  const matches = recipes.filter(r => {
    const allIngredients = r.ingredientGroups.map(g => g.items.join(" ")).join(" ");
    const haystack = (r.title + " " + allIngredients).toLowerCase();
    return !q || haystack.includes(q);
  });

  const categories = categoryOrder.filter(c => matches.some(r => r.category === c));
  matches.forEach(r => {
    if (!categories.includes(r.category)) categories.push(r.category);
  });

  categories.forEach(cat => {
    const items = matches.filter(r => r.category === cat);
    if (items.length === 0) return;

    const section = document.createElement('div');
    section.className = 'category-section';

    const heading = document.createElement('h2');
    heading.className = 'category-heading';
    heading.textContent = cat;
    section.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'category-grid';

    items.forEach(r => {
      shown++;
      const btn = document.createElement('button');
      btn.className = 'recipe-entry';
      btn.onclick = () => showDetail(r.id);
      btn.innerHTML = `
        <div class="thumb" style="background:${r.color}">${r.emoji}</div>
        <h2>${r.title}</h2>
        <div class="meta">${r.servings} · ${r.time}</div>
      `;
      grid.appendChild(btn);
    });

    section.appendChild(grid);
    listEl.appendChild(section);
  });

  emptyEl.style.display = shown === 0 ? 'block' : 'none';
  updateCount(recipes.length);
}

function getChecked(key){
  try{
    return JSON.parse(localStorage.getItem(key) || "{}");
  }catch(e){ return {}; }
}
function setChecked(key, state){
  try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){}
}

function renderDetail(r){
  let html = `<div class="detail-thumb" style="background:${r.color}">${r.emoji}</div>`;
  html += `<h1 class="recipe-title">${r.title}</h1>`;
  html += `<div class="recipe-meta-row">
      <span>🍽️ ${r.servings}</span>
      <span>⏱️ ${r.time}</span>
    </div>`;

  html += `<h2 class="section-title">Ingrediënten</h2>`;
  r.ingredientGroups.forEach((group, gi) => {
    const ingKey = 'kookboek-ing-' + r.id + '-' + gi;
    const ingState = getChecked(ingKey);
    html += `<h3 class="subgroup-title">${group.name}</h3><ul class="check-list">`;
    group.items.forEach((item, i) => {
      const cid = `ing-${r.id}-${gi}-${i}`;
      const checked = ingState[i] ? 'checked' : '';
      html += `<li class="check-item">
        <input type="checkbox" id="${cid}" data-key="${ingKey}" data-index="${i}" class="ing-check" ${checked}>
        <label for="${cid}">${item}</label>
      </li>`;
    });
    html += `</ul>`;
  });

  html += `<h2 class="section-title">Bereiding</h2>`;
  r.stepGroups.forEach((group, gi) => {
    const stepKey = 'kookboek-step-' + r.id + '-' + gi;
    const stepState = getChecked(stepKey);
    html += `<h3 class="subgroup-title">${group.name}</h3><ul class="check-list">`;
    group.steps.forEach((step, i) => {
      const cid = `step-${r.id}-${gi}-${i}`;
      const checked = stepState[i] ? 'checked' : '';
      html += `<li class="check-item">
        <input type="checkbox" id="${cid}" data-key="${stepKey}" data-index="${i}" class="step-check" ${checked}>
        <label for="${cid}">${step}</label>
      </li>`;
    });
    html += `</ul>`;
  });

  if (r.source) {
    html += `<p class="source-line">Bron: ${r.source.label} — <a href="${r.source.url}" target="_blank" rel="noopener">${r.source.url}</a></p>`;
  }

  detailContent.innerHTML = html;

  detailContent.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const key = cb.dataset.key;
      const idx = cb.dataset.index;
      const state = getChecked(key);
      state[idx] = cb.checked;
      setChecked(key, state);
    });
  });
}

const wishlistEl = document.getElementById('wishlist-view');
const wishlistListEl = document.getElementById('wishlist-list');
const wishlistEmptyEl = document.getElementById('wishlist-empty');
const wishlistInputEl = document.getElementById('wishlist-input');

function showDetail(id){
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  renderDetail(r);
  document.querySelector('header.top .search-wrap').style.display = 'none';
  document.querySelector('.wishlist-toggle').style.display = 'none';
  listEl.style.display = 'none';
  emptyEl.style.display = 'none';
  wishlistEl.style.display = 'none';
  detailEl.style.display = 'block';
  window.scrollTo(0,0);
  location.hash = id;
}

function showList(){
  detailEl.style.display = 'none';
  wishlistEl.style.display = 'none';
  document.querySelector('header.top .search-wrap').style.display = 'block';
  document.querySelector('.wishlist-toggle').style.display = 'inline-block';
  listEl.style.display = 'flex';
  history.replaceState(null, '', location.pathname);
  renderList(searchEl.value);
}

function getWishlist(){
  try{
    return JSON.parse(localStorage.getItem('kookboek-wishlist') || "[]");
  }catch(e){ return []; }
}
function setWishlist(items){
  try{ localStorage.setItem('kookboek-wishlist', JSON.stringify(items)); }catch(e){}
}

function renderWishlist(){
  const items = getWishlist();
  wishlistListEl.innerHTML = "";
  wishlistEmptyEl.style.display = items.length === 0 ? 'block' : 'none';

  items.forEach(item => {
    const li = document.createElement('li');
    li.className = 'check-item wishlist-item';
    const cid = 'wish-' + item.id;
    li.innerHTML = `
      <input type="checkbox" id="${cid}" ${item.done ? 'checked' : ''}>
      <label for="${cid}">${item.text}</label>
      <button class="delete-btn" aria-label="Verwijderen">×</button>
    `;
    li.querySelector('input').addEventListener('change', (e) => {
      const all = getWishlist();
      const found = all.find(x => x.id === item.id);
      if (found) found.done = e.target.checked;
      setWishlist(all);
    });
    li.querySelector('.delete-btn').addEventListener('click', () => {
      const all = getWishlist().filter(x => x.id !== item.id);
      setWishlist(all);
      renderWishlist();
    });
    wishlistListEl.appendChild(li);
  });
}

function addWishlistItem(){
  const text = wishlistInputEl.value.trim();
  if (!text) return;
  const items = getWishlist();
  items.unshift({ id: Date.now().toString(), text, done: false });
  setWishlist(items);
  wishlistInputEl.value = "";
  renderWishlist();
}

wishlistInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addWishlistItem();
});

function showWishlist(){
  listEl.style.display = 'none';
  emptyEl.style.display = 'none';
  detailEl.style.display = 'none';
  document.querySelector('header.top .search-wrap').style.display = 'none';
  document.querySelector('.wishlist-toggle').style.display = 'none';
  wishlistEl.style.display = 'block';
  renderWishlist();
  window.scrollTo(0,0);
}

searchEl.addEventListener('input', () => renderList(searchEl.value));

const initialId = location.hash.replace('#', '');
renderList('');
if (initialId && recipes.some(r => r.id === initialId)) {
  showDetail(initialId);
}
</script>
